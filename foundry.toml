[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
# Keep compiler source paths deterministic and relative. Foundry's automatic
# transitive remapping discovery can otherwise record the absolute checkout
# path in verification metadata.
auto_detect_remappings = false
solc_version = "0.8.30"
evm_version = "cancun"
bytecode_hash = "none"
ffi = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./.forge-snapshots/" }]

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
